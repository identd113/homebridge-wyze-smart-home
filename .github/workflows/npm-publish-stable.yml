# Stable npm release: publishes to the `latest` tag.
#
# Trigger: GitHub release published WITHOUT the "Pre-release" checkbox.
# Beta releases (checkbox checked) are handled by npm-publish-beta.yml.
#
# Bridge-specific: `dependencies.wyze-api` in package.json is the single
# declaration of the minimum wyze-api version (a semver range), also
# checked by the plugin at startup. Before publish, the workflow verifies
# a published *stable* (non-prerelease) wyze-api satisfies that range, so
# release wyze-api first.
#
# Safeguards:
#   * Version in package.json must NOT contain `-beta.`
#   * Version must not already be on npm
#   * NPM_TOKEN secret must be present and valid
#   * Submodule must be checked out — workflow exits early if missing

name: npm publish (stable)

on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: read

jobs:
  guard:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read package version
        id: read
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Refuse beta version on stable workflow
        run: |
          VERSION="${{ steps.read.outputs.version }}"
          if [[ "$VERSION" == *-beta.* ]] || [[ "$VERSION" == *-alpha.* ]] || [[ "$VERSION" == *-rc.* ]]; then
            echo "Version $VERSION is a pre-release identifier but the GitHub release is marked stable."
            echo "Either uncheck the 'Pre-release' box in the GitHub release UI, or rename the package.json version to a stable identifier."
            exit 1
          fi

  publish:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          always-auth: true
      - run: npm install --package-lock-only
      - run: npm ci
      - name: Verify a stable wyze-api satisfies the declared range
        # Single source of truth: dependencies.wyze-api in package.json is the
        # minimum wyze-api this release supports. A stable plugin must not
        # depend on a prerelease, so only non-prerelease wyze-api versions
        # count. Fail early if none satisfies the range (e.g. wyze-api was not
        # published first, or the range still names a beta such as
        # ^2.0.0-beta.3 instead of ^2.0.0).
        run: |
          RANGE=$(node -p "require('./package.json').dependencies['wyze-api']")
          FOUND=$(npm view wyze-api versions --json 2>/dev/null | RANGE="$RANGE" node -e "const semver=require('semver');let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const stable=[].concat(JSON.parse(s)).filter(v=>!semver.prerelease(v));console.log(semver.maxSatisfying(stable,process.env.RANGE)||'')}catch(e){console.log('')}})")
          if [ -z "$FOUND" ]; then
            echo "No stable (non-prerelease) wyze-api satisfies '$RANGE'. Publish a stable wyze-api first and set dependencies.wyze-api to its stable range, then re-run."
            exit 1
          fi
          echo "wyze-api range '$RANGE' resolves to stable $FOUND"
      - name: Ensure NPM_TOKEN is configured
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is missing."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Validate npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Validate bridge version is unpublished
        run: |
          VERSION="${{ needs.guard.outputs.version }}"
          if npm view "homebridge-wyze-smart-home@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already published to npm. Bump package.json version first."
            exit 1
          fi
          echo "Publishing homebridge-wyze-smart-home@$VERSION to latest"
      - run: npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
