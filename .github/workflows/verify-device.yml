# When a maintainer (write access or more) adds the "verified" label to a device report that
# says the device works, this marks the device as confirmed in the README and opens a pull
# request for it. The logic is in .github/scripts/verify-device.js (tested in tests/). The
# issue text is untrusted, so it is only read by that script as data.
#
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".

name: Verify device

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: verify-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event.label.name == 'verified' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const { run } = require('./.github/scripts/verify-device.js')
            await run({ github, context, core })
