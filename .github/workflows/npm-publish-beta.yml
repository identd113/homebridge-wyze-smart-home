# Beta npm release: publishes to the `beta` tag.
#
# Trigger: GitHub release published WITH the "Pre-release" checkbox.
# Stable releases (checkbox unchecked) are handled by npm-publish-stable.yml.
#
# Bridge-specific:
#   * `dependencies.wyze-api` in package.json is the single declaration of
#     the minimum wyze-api version (a semver range). The plugin also checks
#     the installed wyze-api against that same range at startup.
#   * Verifies a published wyze-api satisfies that range before publishing,
#     so the api must be released to npm first.
#
# Users on `npm install homebridge-wyze-smart-home` keep getting
# `latest` — `beta` releases are only seen by users who explicitly opt
# in with `npm install homebridge-wyze-smart-home@beta`.

name: npm publish (beta)

on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: read

jobs:
  guard:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == true }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read package version
        id: read
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Require pre-release identifier on bridge
        run: |
          VERSION="${{ steps.read.outputs.version }}"
          if [[ "$VERSION" != *-beta.* ]] && [[ "$VERSION" != *-alpha.* ]] && [[ "$VERSION" != *-rc.* ]]; then
            echo "Version $VERSION has no pre-release identifier (e.g. -beta.1) but the GitHub release is marked Pre-release."
            echo "Either bump package.json to e.g. 2.0.0-beta.1, or uncheck the Pre-release box (and use the stable workflow)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          always-auth: true
      - run: npm install --package-lock-only
      - run: npm ci
      - name: Verify a published wyze-api satisfies the declared range
        # Single source of truth: dependencies.wyze-api in package.json is the
        # minimum wyze-api this release supports. Fail early if nothing on npm
        # satisfies it (e.g. wyze-api was not published first).
        run: |
          RANGE=$(node -p "require('./package.json').dependencies['wyze-api']")
          FOUND=$(npm view "wyze-api@$RANGE" version 2>/dev/null | tail -1 || true)
          if [ -z "$FOUND" ]; then
            echo "No published wyze-api satisfies '$RANGE'. Publish wyze-api first, then re-run."
            exit 1
          fi
          echo "wyze-api range '$RANGE' resolves to $FOUND"
      - name: Ensure NPM_TOKEN is configured
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is missing."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Validate npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Validate bridge version is unpublished
        run: |
          VERSION="${{ needs.guard.outputs.version }}"
          if npm view "homebridge-wyze-smart-home@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already published to npm. Bump package.json version first."
            exit 1
          fi
          echo "Publishing homebridge-wyze-smart-home@$VERSION to beta tag"
      - run: npm publish --access public --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
