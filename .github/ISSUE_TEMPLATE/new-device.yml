name: Wyze device report
description: Ask for a Wyze device the plugin does not handle yet, or tell us whether a supported one works
title: "[Device]: "
labels: ["new device"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping the plugin learn about your Wyze devices. Use this form to ask for a device the plugin does not handle yet, or to say whether a device it does handle **works**, **partly works** or **does not work**.

        Please check the **Supported Devices** and **Not Yet Supported** lists in the [README](https://github.com/identd113/homebridge-wyze-smart-home#supported-devices) first. Scales, headphones, chime boxes and similar products are known and are not planned for HomeKit, so there is no need to report those.

        For a bug that is not about one device (a crash, a login problem, a setting that does nothing), use the bug report form instead.

        **Nothing here is sent automatically.** You choose what to paste. Please read what you paste and remove anything personal (email, address, Wi-Fi name, IP and MAC addresses, location) before you submit.

  - type: dropdown
    id: report
    attributes:
      label: What are you reporting?
      options:
        - It is not supported yet
        - It works
        - It partly works
        - It does not work
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model code
      description: |
        The plugin logs a line like `Unsupported device type: (Name: ...) (MAC: ...) (Model: XXXX)`. Copy the value after `Model:`. Turn on debug logging in the plugin settings first (Log Level: debug) and restart Homebridge to see it.
      placeholder: "HL_ABC"
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: What the device is called
      description: The product name, for example "Wyze Cam Floodlight Pro" or "Wyze Window Cam".
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of device is it?
      options:
        - Camera or doorbell
        - Light, bulb or light strip
        - Plug, outlet or switch
        - Sensor (contact, motion, leak, climate)
        - Lock or keypad
        - Thermostat or room sensor
        - Vacuum, sprinkler or other appliance
        - Something else
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: Shown in the Wyze app under the device's settings, then Device Info.
      placeholder: "1.2.3.456"

  - type: textarea
    id: features
    attributes:
      label: What the device does in the Wyze app
      description: The controls and readings you see, for example "turns a light on and off, shows battery, has a siren".
    validations:
      required: true

  - type: input
    id: plugin
    attributes:
      label: Plugin version
      description: Leave blank if the device is not supported yet. Otherwise the version in the Homebridge UI, for example the one shown at startup.
      placeholder: "2.0.0-beta.3"

  - type: textarea
    id: wanted
    attributes:
      label: What you would like in HomeKit
      description: For a device that is not supported yet, for example "a switch for the light" or "a sensor that shows when the door opens".

  - type: textarea
    id: result
    attributes:
      label: What works and what does not in HomeKit
      description: For a device the plugin handles. For example "on and off work, brightness does nothing, it shows offline after a few hours".

  - type: textarea
    id: blob
    attributes:
      label: Device information
      description: |
        **Needed when the device is not supported yet; helpful, but optional, when it already works or partly works.** Paste what the plugin knows about the device. With debug logging on, restart Homebridge and find the `get_object_list` response in the log. Copy **only the entry for this device** (the part with its model code), not the whole list.

        **Edit it before you paste.** The log entry includes details that identify you or your network: the device's MAC address, its name, its IP address and your Wi-Fi network name (`mac`, `nickname`, `ip`, `ssid`). Replace those values with `REDACTED`. The model code, firmware version and the rest of the settings are what we need.
      render: json

  - type: textarea
    id: logs
    attributes:
      label: Anything else from the log (optional)
      description: Errors or warnings around the time the plugin starts. Paste them here.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I looked at the README lists for this device.
          required: true
        - label: I removed personal details from what I pasted.
          required: true
        - label: I can try a test version of the plugin and report back.
