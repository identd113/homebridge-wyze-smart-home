name: Wyze device report
description: Ask for a Wyze device the plugin does not handle yet, or tell us whether a supported one works
title: "[Device]: "
labels: ["new device"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping the plugin learn about your Wyze devices. Use this form to ask for a device the plugin does not handle yet, or to say whether one it does handle **works**, **partly works** or **does not work**. For a bug that is not about one device (a crash, a login problem, a setting that does nothing), use the bug report form instead.

        **Nothing here is sent automatically.** You choose what to paste. Scales, headphones, chime boxes and similar products are known and are not planned for HomeKit.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I looked at the **Supported Devices** and **Not Yet Supported** lists in the [README](https://github.com/identd113/homebridge-wyze-smart-home#supported-devices) for this device.
          required: true
        - label: I will remove personal details from anything I paste (email, address, Wi-Fi name, IP and MAC addresses, location).
          required: true
        - label: I can try a test version of the plugin and report back.

  - type: dropdown
    id: report
    attributes:
      label: What are you reporting?
      options:
        - It is not supported yet
        - It works
        - It partly works
        - It does not work
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device
      description: Pick your device by name; its model code is in brackets. If it is not listed, choose the last option and fill in the next two questions.
      options:
        # BEGIN device options (npm run device-options)
        - "Doorbells - Video Doorbell Pro 2 (AN_RDB1)"
        - "Doorbells - Video Doorbell v2 (HL_DB2)"
        - "Doorbells - Video Doorbell Pro (GW_BE1)"
        - "Doorbells - Video Doorbell (WYZEDB3)"
        - "Cameras - Cam Pan v4 (HL_PAN4)"
        - "Cameras - Bulb Cam (HL_BC)"
        - "Cameras - Cam v4 (HL_CAM4)"
        - "Cameras - Cam Floodlight v2 (HL_CFL2)"
        - "Cameras - Cam Floodlight Pro (LD_CFP)"
        - "Cameras - Cam OG (GW_GC1)"
        - "Cameras - Cam OG Telephoto 3x (GW_GC)"
        - "Cameras - Cam Pan Pro (HL_PANP)"
        - "Cameras - Cam Pan v3 (HL_PAN3)"
        - "Cameras - Cam v3 Pro (HL_CAM3P)"
        - "Cameras - Cam Pan v2 (HL_PAN2)"
        - "Cameras - Cam v3 / Floodlight Cam (WYZE_CAKP2JFUS)"
        - "Cameras - Cam Pan (WYZECP1_JEF)"
        - "Cameras - Cam v2 (WYZEC1-JZ)"
        - "Cameras - Cam v1 (WYZEC1)"
        - "Battery cameras - Battery Cam Pro (AN_RSCW)"
        - "Battery cameras - Cam Outdoor v2 (HL_WCO2)"
        - "Battery cameras - Cam Outdoor (WVOD1)"
        - "Locks - Gun Safe (GUNSFE)"
        - "Locks - Lock Bolt v2 (DX_LB2)"
        - "Locks - Palm Lock (DX_PVLOC)"
        - "Locks - Lock (YD.LO1)"
        - "Lights - Color Bulb A19 v2 (HL_A19C2)"
        - "Lights - Color Bulb BR30 (HL_BR30C)"
        - "Lights - Bulb White v2 (HL_HWB2)"
        - "Lights - Light Strip (HL_LSL)"
        - "Lights - Light Strip Pro (HL_LSLP)"
        - "Lights - Color Bulb A19 (WLPA19C)"
        - "Lights - Bulb White (WLPA19)"
        - "Plugs and switches - Wall Switch (LD_SS1)"
        - "Plugs and switches - Outdoor Plug (WLPPO-SUB)"
        - "Plugs and switches - Plug (WLPP1)"
        - "Plugs and switches - Plug (alternate model) (WLPP1CFH)"
        - "Sensors - Leak Sensor (WS3U)"
        - "Sensors - Temperature & Humidity Sensor (TH3U)"
        - "Sensors - Contact Sensor v2 (DWS3U)"
        - "Sensors - Home Monitoring System (GW3U)"
        - "Sensors - Motion Sensor v2 (PIR3U)"
        - "Sensors - Contact Sensor v1 (DWS2U)"
        - "Sensors - Motion Sensor v1 (PIR2U)"
        - "Climate - Thermostat (CO_EA1)"
        - "Climate - Thermostat Room Sensor (CO_TH1)"
        - "Appliances - Air Purifier (CO_AP1)"
        - "Appliances - Robot Vacuum (JA_RO2)"
        - "Appliances - Sprinkler Controller (BS_WK1)"
        - "Not in this list (enter the model code below)"
        # END device options
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model code (only if your device is not in the list)
      description: |
        The plugin logs a line like `Unsupported device type: (Name: ...) (MAC: ...) (Model: XXXX)`. Copy the value after `Model:`. Turn on debug logging in the plugin settings first (Log Level: debug) and restart Homebridge to see it.
      placeholder: "HL_ABC"

  - type: dropdown
    id: kind
    attributes:
      label: What kind of device is it?
      description: Only if it is not in the list.
      options:
        - Camera or doorbell
        - Light, bulb or light strip
        - Plug, outlet or switch
        - Sensor (contact, motion, leak, climate)
        - Lock or keypad
        - Thermostat or room sensor
        - Vacuum, sprinkler or other appliance
        - Something else

  - type: input
    id: plugin
    attributes:
      label: Plugin version
      description: For a device the plugin already handles. Shown in the Homebridge UI and at startup.
      placeholder: "2.0.0-beta.3"

  - type: textarea
    id: details
    attributes:
      label: What the device does, and what you see in HomeKit
      description: |
        The product name, if it is not in the list (for example "Wyze Window Cam"). What it does in the Wyze app (for example "turns a light on and off, shows battery, has a siren"). For a device that is not supported yet, what you would like in HomeKit; for one the plugin handles, what works and what does not.

  - type: textarea
    id: blob
    attributes:
      label: Device information
      description: |
        **Needed when the device is not supported yet; optional when it works.** Paste what the plugin knows about the device. With debug logging on, restart Homebridge and find the `get_object_list` response in the log. Copy **only the entry for this device** (the part with its model code), including its firmware version, not the whole list.

        **Edit it before you paste.** The log entry includes details that identify you or your network: the device's MAC address, its name, its IP address and your Wi-Fi network name (`mac`, `nickname`, `ip`, `ssid`). Replace those values with `REDACTED`.
      render: json

  - type: textarea
    id: logs
    attributes:
      label: Anything else from the log (optional)
      description: Errors or warnings around the time the plugin starts, or when you use the device. Paste them here.
      render: text
