name: Feature request
description: An idea for something the plugin could do
title: "[Feature]: "
labels: ["enhancement"]
assignees: ["identd113"]
body:
  - type: markdown
    attributes:
      value: |
        For a Wyze device the plugin does not support yet, please use the **Wyze device report** form instead. It asks for the details needed to add a device, and also takes reports that a device works or does not work.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem or the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you have tried or considered instead
