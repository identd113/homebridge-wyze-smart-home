name: Bug report
description: Something does not work the way it should
title: "[Bug]: "
labels: ["bug"]
assignees: ["identd113"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. It also covers the `wyze-api` library the plugin is built on: problems with login, the Wyze API or camera streaming belong here too. For one device that works, partly works or does not work, the **Wyze device report** form is quicker.

        **Logs and config contain details that identify you or your network** (device names, MAC and IP addresses, your Wi-Fi name, your Wyze email). Replace those with `REDACTED` before you paste. **Never post your password, API key, key ID or tokens**: if you do, change them in the Wyze developer portal, then edit them out of the issue.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I removed personal details and credentials from anything I paste.
          required: true
        - label: I looked for an existing issue about this.
          required: true

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: A short description, and the steps that cause it if you know them.
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and model code
      description: Only if it is about one device, for example "Cam v3 (WYZE_CAKP2JFUS)".

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: "The plugin and wyze-api versions are printed in the Homebridge log at startup. `homebridge -V` and `node -v` give the other two."
      value: |
        Plugin:
        wyze-api:
        Homebridge:
        Node.js:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The Homebridge log around the time of the problem. Set the plugin's Log Level to debug if the info log shows nothing.
      render: text

  - type: textarea
    id: config
    attributes:
      label: Plugin config
      description: The WyzeSmartHome part of your `config.json`, with every credential removed.
      render: json

  - type: input
    id: origin
    attributes:
      label: Where did you come from?
      description: Filled in for you when you followed a link from another page, for example the wyze-api repository. Otherwise leave it empty.
